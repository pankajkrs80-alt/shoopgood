<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buy Custom Product</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Firebase SDKs (Using Compat libraries for easy vanilla JS integration) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <!-- Add this below your Firebase scripts in index.html -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>
<!-- Top Navigation Bar -->
    <!-- Top Navigation Bar -->
    <header style="width: 100%; max-width: 800px; display: flex; justify-content: flex-end; margin-bottom: -20px; z-index: 10;">
        <button id="my-account-btn" class="hidden" style="background: none; border: 1px solid var(--primary-color); padding: 8px 16px; border-radius: var(--border-radius); cursor: pointer; font-weight: bold;">My Account</button>
    </header>
    <!-- SECTION 1: Product Page -->
    <main id="product-section" class="container">
        <div class="image-gallery">
            <!-- Replace src with your actual image URLs -->
            <img src="https://via.placeholder.com/400x400" alt="Product Image 1" class="main-image">
            <div class="thumbnails">
                <img src="https://via.placeholder.com/100x100" alt="Thumb 1">
                <img src="https://via.placeholder.com/100x100" alt="Thumb 2">
            </div>
        </div>
        
        <div class="product-info">
            <h1>Your Custom Product Title</h1>
            <div class="reviews">⭐⭐⭐⭐⭐ (24 Reviews)</div>
            <p class="description">
                Detailed description of your amazing product goes here. Explain why they need it and what makes it customizable.
            </p>
            <h2 class="price">$49.99</h2>
            <button id="buy-now-btn" class="primary-btn">Buy Now</button>
        </div>
    </main>

    <!-- SECTION 2: OTP Login (Hidden by default) -->
    <section id="login-section" class="container hidden">
        <div class="card">
            <h2>Login to Continue</h2>
            <p>Please enter your mobile number to receive an OTP.</p>
            
            <div id="recaptcha-container"></div>
            
            <div id="phone-input-group">
                <input type="tel" id="phone-number" placeholder="+1 234 567 8900" required>
                <button id="send-otp-btn" class="primary-btn">Send OTP</button>
            </div>

            <div id="otp-input-group" class="hidden">
                <input type="text" id="otp-code" placeholder="Enter 6-digit OTP" required>
                <button id="verify-otp-btn" class="primary-btn">Verify & Checkout</button>
            </div>
        </div>
    </section>

 <!-- SECTION 3: Address Form (Hidden by default) -->
    <section id="address-section" class="container hidden">
        <div class="card">
            <h2>Shipping Details</h2>
            <form id="checkout-form">
                <input type="text" id="fullName" placeholder="Full Name" required>
                <input type="text" id="streetAddress" placeholder="Street Address" required>
                <div class="row">
                    <input type="text" id="city" placeholder="City" required>
                    <input type="text" id="zipCode" placeholder="Zip/Postal Code" required>
                </div>
                <button type="submit" class="primary-btn">Complete Order</button>
            </form>
        </div>
    </section>

    <!-- SECTION 4: Customer Dashboard (Hidden by default) -->
    <section id="account-section" class="container hidden">
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 20px;">
                <h2>My Account</h2>
                <button id="logout-btn" style="background: #dc3545; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer;">Logout</button>
            </div>
            
            <h3>Profile Details</h3>
            <div id="profile-details" style="background: var(--bg-color); padding: 15px; border-radius: var(--border-radius); margin-bottom: 30px;">
                <!-- Profile details will inject here -->
            </div>

            <h3>My Orders</h3>
            <div id="orders-list">
                <!-- Orders will inject here -->
            </div>
            
            <button id="back-to-shop-btn" class="primary-btn" style="margin-top: 20px;">Back to Shop</button>
        </div>
    </section>

    <!-- THE SCRIPT TAG MUST BE DOWN HERE -->
    <script src="app.js"></script>
</body>
</html>
